<div
    id="add-experience-modal"
    class="project-form-modal experience-form-modal"
    popover="auto"
    role="dialog"
    aria-modal="true"
    aria-labelledby="add-experience-modal-title"
>
    <button
        type="button"
        class="project-form-modal__backdrop"
        popovertarget="add-experience-modal"
        popovertargetaction="hide"
        aria-label="Close add experience form"
    ></button>

    <div class="project-form-modal__content">
        <button
            type="button"
            class="project-form-modal__close"
            popovertarget="add-experience-modal"
            popovertargetaction="hide"
            aria-label="Close add experience form"
        >
            &times;
        </button>

        <h2 id="add-experience-modal-title">Add Experience</h2>
        <form
            id="experience-form"
            method="post"
            action="{% url 'main:create_experience' %}"
            class="experience-form"
        >
            {% csrf_token %}

            {% for error in form.non_field_errors %}
                <p class="form-error">{{ error }}</p>
            {% endfor %}

            {% for field in form %}
                <div class="form-group">
                    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    {% for error in field.errors %}
                        <p class="form-error">{{ error }}</p>
                    {% endfor %}
                </div>
            {% endfor %}

            <div class="project-form-modal__actions">
                <button
                    type="button"
                    class="button button-secondary"
                    popovertarget="add-experience-modal"
                    popovertargetaction="hide"
                >
                    Cancel
                </button>
                <button type="submit" class="button">Add Experience</button>
            </div>
        </form>
    </div>
</div>
